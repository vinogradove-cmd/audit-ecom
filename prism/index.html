<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>PRISM-логика: профиль поведения</title>
<style>
:root{
  --bg:#0F1115; --panel:#161A20; --line:#242A33;
  --ink:#EAF0F5; --dim:#93A1B1; --lime:#C6FF3D;
  --red:#FF5B45; --gold:#FFC53D; --green:#4FD1A5; --blue:#5AA9FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100dvh; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:20px 20px 28px;flex:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--lime);display:inline-block}
h1{font-size:27px;line-height:1.15;margin:18px 0 10px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--lime)}
p.lead{color:var(--dim);margin:0 0 18px;font-size:15px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-bottom:22px}
.meta b{color:var(--ink);font-weight:600}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;
  background:var(--lime);color:#12160C;cursor:pointer;font-family:inherit;
}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn + .btn{margin-top:10px}
.spacer{flex:1}
.hint{color:var(--dim);font-size:12.5px;margin-top:14px;line-height:1.5}

/* progress */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .25s ease}
.count{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:44px;text-align:right}

/* question */
.q{font-size:22px;line-height:1.3;font-weight:650;letter-spacing:-.01em;margin:6px 0 22px;min-height:96px}
.scale{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:13px 14px;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s;
}
.opt:active{background:#1B2028}
.opt .n{width:24px;height:24px;border-radius:8px;background:#20262F;color:var(--dim);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.opt.sel{border-color:var(--lime);background:#1B2311}
.opt.sel .n{background:var(--lime);color:#12160C}
.back{margin-top:16px;background:none;border:0;color:var(--dim);font-size:13.5px;font-family:inherit;padding:8px 0;cursor:pointer}

/* results */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 20px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.qcard .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.qcard .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.qcard small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.rows{display:flex;flex-direction:column;gap:11px;margin:4px 0 20px}
.row .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.row .t b{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}
.track{height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;width:0;transition:width .5s ease}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:12px;padding:13px 14px;font-size:14px;color:#CFDBE6;margin-bottom:12px}
.note b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DIMS = [
  {id:'INN', name:'Инновации',      q:'gold',  desc:'идеи, нестандартность'},
  {id:'INIT',name:'Инициатива',     q:'gold',  desc:'контакт, убеждение'},
  {id:'SUP', name:'Поддержка',      q:'green', desc:'терпение, участие'},
  {id:'CO',  name:'Координация',    q:'green', desc:'команда, договорённости'},
  {id:'FOC', name:'Фокус',          q:'blue',  desc:'детали, точность'},
  {id:'DEL', name:'Достижение',     q:'red',   desc:'темп, прямота, напор'},
  {id:'FIN', name:'Доведение',      q:'red',   desc:'настойчивость, сроки'},
  {id:'EVAL',name:'Оценка',         q:'blue',  desc:'анализ, осторожность'}
];

const ITEMS = {
  INN:[ 'Мне быстро приходят в голову новые идеи, даже когда меня не спрашивают.',
        'Я люблю придумывать, как сделать привычное иначе.',
        'Мне скучно повторять одно и то же по готовой схеме.',
        'Я вижу возможности там, где другие видят рутину.',
        'Я часто предлагаю нестандартное решение первым.',
        'Мне нравится придумывать концепции и «картинку будущего».' ],
  INIT:['Я легко завожу разговор с незнакомыми людьми.',
        'Мне нравится убеждать и «продавать» идею.',
        'Я говорю эмоционально и с энтузиазмом.',
        'Я быстро осваиваюсь в новой компании.',
        'Я могу увлечь людей своей идеей.',
        'Мне важно, чтобы меня слышали и замечали.' ],
  SUP: [ 'Я терпеливо выслушиваю, даже если не согласен.',
        'Мне важно, чтобы в команде не было конфликтов.',
        'Я спокойно делаю повторяющуюся работу, если она нужна.',
        'Я замечаю, когда человеку рядом плохо, и предлагаю помощь.',
        'Я редко повышаю голос.',
        'Мне важнее сохранить отношения, чем настоять на своём.' ],
  CO:  [ 'Я люблю советоваться перед решением.',
        'Я умею распределять работу так, чтобы всем было удобно.',
        'Мне нравится работать в команде, а не в одиночку.',
        'Я держусь договорённостей и не люблю резких перемен планов.',
        'Я спокойно отношусь к тому, что решение принимается долго.',
        'Я охотно подстраиваюсь под чужие правила игры.' ],
  FOC: [ 'Я перечитываю документ перед отправкой.',
        'Меня раздражает, когда в цифрах нет точности.',
        'Я раскладываю задачу на шаги, прежде чем начать.',
        'Я замечаю ошибки в текстах и таблицах.',
        'Я предпочитаю письменные договорённости разговорам.',
        'Я опираюсь на факты, а не на ощущения.' ],
  DEL: [ 'Я быстро перехожу к действию, не дожидаясь идеальных условий.',
        'Мне важно побеждать, а не участвовать.',
        'Я говорю прямо, даже если это резко.',
        'Я беру ответственность и жду, что остальные подстроятся под темп.',
        'Меня злит медлительность в работе.',
        'Я готов идти на конфликт ради результата.' ],
  FIN: [ 'Я довожу до конца даже скучные дела.',
        'Я возвращаюсь к незакрытым задачам без напоминаний.',
        'Я держу сроки, которые обещал.',
        'Я не бросаю дело, когда пропадает интерес.',
        'Я работаю над задачей системно, каждый день понемногу.',
        'У меня редко висят «хвосты» из прошлых задач.' ],
  EVAL:[ 'Прежде чем согласиться, я проверяю данные и считаю.',
        'Я люблю разбирать варианты и сравнивать их по критериям.',
        'Я не верю на слово, если не видел подтверждения.',
        'Я вижу слабые места в чужой идее быстрее, чем сильные.',
        'Мне нравится анализировать, почему что-то сработало или нет.',
        'Я осторожен в решениях и не спешу рисковать.' ]
};

// порядок: раунды по одному пункту из каждой шкалы — без «шести одинаковых подряд»
const SEQ = [];
for (let r=0; r<6; r++) DIMS.forEach(d => SEQ.push({dim:d.id, text:ITEMS[d.id][r]}));

const OPTIONS = [
  {v:1, t:'Совсем не про меня'},
  {v:2, t:'Скорее нет'},
  {v:3, t:'Иногда, по-разному'},
  {v:4, t:'Скорее да'},
  {v:5, t:'Точно про меня'}
];

const QNAME = {red:'Драйв', gold:'Экспрессия', green:'Стабильность', blue:'Анализ'};
const QCOLOR = {red:'var(--red)', gold:'var(--gold)', green:'var(--green)', blue:'var(--blue)'};

let answers = new Array(SEQ.length).fill(0);
let idx = 0;
const app = document.getElementById('app');

/* восстановление прогресса */
try {
  const saved = JSON.parse(localStorage.getItem('prism48') || 'null');
  if (saved && Array.isArray(saved.answers) && saved.answers.length === SEQ.length) {
    answers = saved.answers; idx = Math.min(saved.idx || 0, SEQ.length);
  }
} catch(e){}
function save(){ try{ localStorage.setItem('prism48', JSON.stringify({answers, idx})); }catch(e){} }

function renderIntro(){
  const done = answers.filter(Boolean).length;
  app.innerHTML = `
    <div class="brand"><i></i>PRISM-логика</div>
    <h1>Профиль поведения:<br><span>8 шкал, 4 цвета</span></h1>
    <p class="lead">Опросник в логике PRISM Brain Mapping: оцени, насколько каждое утверждение про тебя, и получишь микс Драйв / Экспрессия / Стабильность / Анализ.</p>
    <div class="meta"><span><b>48</b> утверждений</span><span><b>5</b> минут</span><span>шкала 1–5</span></div>
    <div class="spacer"></div>
    ${done ? '<button class="btn" id="go">Продолжить · '+(done)+'/48</button><button class="btn ghost" id="reset">Начать заново</button>'
           : '<button class="btn" id="go">Начать</button>'}
    <p class="hint">Это не официальный PRISM: инструмент лицензирован и доступен только у сертифицированного практика. Здесь — его логика: 8 поведенческих шкал и 4 квадранта. Ответы остаются в телефоне, никуда не отправляются.</p>
  `;
  document.getElementById('go').onclick = () => { idx = answers.findIndex(v => !v); if (idx < 0) idx = 0; renderItem(); };
  const rs = document.getElementById('reset');
  if (rs) rs.onclick = () => { answers = new Array(SEQ.length).fill(0); idx = 0; save(); renderIntro(); };
}

function renderItem(){
  const it = SEQ[idx];
  const pct = Math.round(answers.filter(Boolean).length / SEQ.length * 100);
  app.innerHTML = `
    <div class="top">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="count">${idx+1}/${SEQ.length}</div>
    </div>
    <div class="q">${it.text}</div>
    <div class="scale">
      ${OPTIONS.map(o => `<button class="opt${answers[idx]===o.v?' sel':''}" data-v="${o.v}"><span class="n">${o.v}</span><span>${o.t}</span></button>`).join('')}
    </div>
    ${idx > 0 ? '<button class="back" id="back">← назад</button>' : '<div style="height:34px"></div>'}
  `;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    answers[idx] = +b.dataset.v;
    save();
    if (answers.every(Boolean)) { renderResults(); return; }
    let next = answers.findIndex((v,i) => i > idx && !v);
    if (next < 0) next = answers.findIndex(v => !v);
    idx = next >= 0 ? next : idx + 1;
    if (idx >= SEQ.length) { renderResults(); return; }
    save(); renderItem();
  });
  const back = document.getElementById('back');
  if (back) back.onclick = () => { idx = Math.max(0, idx-1); save(); renderItem(); };
}

function score(){
  const sum = {}, out = {};
  DIMS.forEach(d => sum[d.id] = 0);
  SEQ.forEach((it,i) => sum[it.dim] += (answers[i] || 0));
  DIMS.forEach(d => out[d.id] = Math.round((sum[d.id] - 6) / 24 * 100));
  const quad = {
    red:  Math.round((out.DEL + out.FIN) / 2),
    gold: Math.round((out.INN + out.INIT) / 2),
    green:Math.round((out.SUP + out.CO) / 2),
    blue: Math.round((out.FOC + out.EVAL) / 2)
  };
  return {out, quad, sum};
}

function renderResults(){
  const {out, quad} = score();
  const order = Object.entries(quad).sort((a,b) => b[1]-a[1]);
  const top = order[0], low = order[order.length-1];
  const strong = [...DIMS].sort((a,b) => out[b.id]-out[a.id]).slice(0,2);
  const weak = [...DIMS].sort((a,b) => out[a.id]-out[b.id]).filter(d => !strong.some(s => s.id === d.id)).slice(0,2);
  const txt = [
    'PRISM-логика, профиль:',
    `Драйв ${quad.red} · Экспрессия ${quad.gold} · Стабильность ${quad.green} · Анализ ${quad.blue}`,
    DIMS.map(d => `${d.name} ${out[d.id]}`).join(' · '),
    `Ведущий цвет: ${QNAME[top[0]]} (${top[1]}), самый слабый: ${QNAME[low[0]]} (${low[1]})`
  ].join('\n');

  app.innerHTML = `
    <div class="brand"><i></i>Результат</div>
    <h1 style="font-size:24px;margin:14px 0 6px">Ведущий цвет — <span style="color:${QCOLOR[top[0]]}">${QNAME[top[0]]}</span></h1>
    <p class="lead" style="margin-bottom:16px">${top[1]} из 100 · слабое звено — ${QNAME[low[0]].toLowerCase()} (${low[1]})</p>
    <div class="quad">
      ${['red','gold','green','blue'].map(k => `
        <div class="qcard">
          <div class="lab" style="color:${QCOLOR[k]}">${QNAME[k]}</div>
          <div class="v">${quad[k]}</div>
          <small>${k==='red'?'напор, напористость':k==='gold'?'идеи, контакт':k==='green'?'терпение, команда':'детали, расчёт'}</small>
        </div>`).join('')}
    </div>
    <div class="rows">
      ${DIMS.map(d => `
        <div class="row">
          <div class="t"><span>${d.name} <span style="color:var(--dim);font-weight:400">· ${d.desc}</span></span><b>${out[d.id]}</b></div>
          <div class="track"><i style="width:${out[d.id]}%;background:${QCOLOR[d.q]}"></i></div>
        </div>`).join('')}
    </div>
    <div class="note"><b>Сильные:</b> ${strong.map(d => d.name.toLowerCase()).join(', ')}. <b>Проседает:</b> ${weak.map(d => d.name.toLowerCase()).join(', ')}.</div>
    <div class="note">Под стрессом обычно усиливается ведущий цвет, а слабый проседает ещё глубже — это и есть твоя «точка срыва».</div>
    <div class="spacer"></div>
    <button class="btn" id="copy">Скопировать результат</button>
    <button class="btn ghost" id="again">Пройти заново</button>
    <p class="hint">Не официальный PRISM. Не использовать для отбора людей.</p>
  `;
  document.getElementById('copy').onclick = async (e) => {
    try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Скопировано ✓'; }
    catch(err){ e.target.textContent = 'Не вышло скопировать'; }
  };
  document.getElementById('again').onclick = () => {
    answers = new Array(SEQ.length).fill(0); idx = 0; save(); renderIntro();
  };
  window.scrollTo({top:0});
}

window.addEventListener('load', () => { answers.every(Boolean) ? renderResults() : renderIntro(); });
</script>
</body>
</html>
